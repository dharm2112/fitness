[tool.poetry]
name = "fitness-counter"
version = "0.1.0"
description = "Real-time fitness counter using MediaPipe"
authors = ["Your Name <you@example.com>"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
